name: Concurrency & Rigor CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-and-concurrency-check:
    name: Build & Concurrency Audit (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang valgrind

      - name: Verify compilation and Makefile targets
        run: |
          make clean
          make all CC=${{ matrix.compiler }}
          make fclean
          make re CC=${{ matrix.compiler }}

      - name: Concurrency Test — ThreadSanitizer (TSan Data-Race Audit)
        run: |
          make tsan CC=${{ matrix.compiler }}
          echo "=== TSan Test 1: Single Philosopher (Must die at ~400ms) ==="
          ./philo/philo 1 400 200 200

          echo "=== TSan Test 2: 4 Philosophers eating 5 times (Zero Data Races) ==="
          ./philo/philo 4 410 200 200 5

      - name: Concurrency Test — Helgrind (Deadlock & Lock Order Audit)
        run: |
          make re CC=${{ matrix.compiler }}
          echo "=== Helgrind Test: Lock contention and deadlock audit ==="
          valgrind --tool=helgrind --error-exitcode=42 ./philo/philo 4 410 200 200 2
          valgrind --tool=helgrind --error-exitcode=42 ./philo/philo 1 400 200 200

      - name: Memory Test — Valgrind Memcheck (Zero Leaks Audit)
        run: |
          valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes --error-exitcode=42 ./philo/philo 4 410 200 200 3
          valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes --error-exitcode=42 ./philo/philo 1 400 200 200

      - name: Functional & Timing Verification
        run: |
          echo "=== Functional Test: Meal counting ==="
          MEALS=$(./philo/philo 4 410 200 200 7 | grep -c "is eating")
          echo "Total meals recorded: $MEALS"
          if [ "$MEALS" -lt 28 ]; then
            echo "Expected at least 28 meals, got $MEALS"
            exit 1
          fi
          echo "All verification checks passed with 100% success!"
